<text class="ink" x="64" y="26" font-size="16" font-weight="600">Calibration on the 2025 test year</text>
<text class="ink2" x="64" y="46" font-size="12">Each point is a bin of site-days (n ≥ 50). On the diagonal = predicted chance matches what happened.</text>
